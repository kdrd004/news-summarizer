name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies for Lambda package
        run: |
          cd backend
          pip install -r requirements.txt -t .

      - name: Zip Lambda function
        run: |
          cd backend
          zip -r lambda.zip .

      - name: Debug - List backend files
        run: ls -R backend

      - name: Debug - Check ZIP size
        run: du -h backend/lambda.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to AWS Lambda
        run: aws lambda update-function-code --function-name news-summarizer --zip-file fileb://backend/lambda.zip
